services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legacy_wolf
      POSTGRES_USER: legacy_wolf
      POSTGRES_PASSWORD: local_only_change_me
    ports: ["5432:5432"]
    volumes: ["legacy-wolf-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["legacy-wolf-redis:/data"]
volumes:
  legacy-wolf-postgres:
  legacy-wolf-redis:
